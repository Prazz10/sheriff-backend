services:
  - type: web
    name: sheriff-backend
    env: node
    buildCommand: npm install && npx tsc
    startCommand: node dist/index.js
    envVars:
      - key: PORT
        value: 3000
      - key: SUPABASE_URL
        fromDatabase: false
      - key: SUPABASE_SERVICE_KEY
        fromDatabase: false
      - key: SUPABASE_ANON_KEY
        fromDatabase: false
      - key: TWILIO_ACCOUNT_SID
        fromDatabase: false
      - key: TWILIO_AUTH_TOKEN
        fromDatabase: false
      - key: TWILIO_PHONE_NUMBER
        fromDatabase: false
      - key: JWT_SECRET
        fromDatabase: false
